<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Good page</title><meta name="description" content="A page with nothing wrong on it.">
<style>
 body{margin:0;font-family:sans-serif;font-size:16px}
 .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:16px}
 @media(max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
 .card{border:1px solid #ccc;padding:12px}
 .desc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .scroller{display:flex;overflow-x:auto;gap:8px}
 .scroller div{flex:0 0 300px;height:60px;background:#eee}
 .drawer{position:fixed;top:0;right:-400px;width:300px;height:100px;background:#ddd}
 .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
 a,button{display:inline-block;min-height:44px;min-width:44px;padding:10px}
</style></head>
<body>
 <h1>Good page</h1>
 <div class="grid">
  <div class="card"><b>Outdoors</b><p class="desc">Hunting, fishing, camping, hiking and everything that happens outside the house</p></div>
  <div class="card"><b>Garage</b><p class="desc">Trucks, engines, tools, builds and the stuff you fix on Saturday morning</p></div>
 </div>
 <div class="scroller"><div></div><div></div><div></div><div></div></div>
 <div class="drawer">menu</div>
 <span class="sr">screen reader text</span>
 <img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" width="40" height="40" alt="dot">
 <a href="/good.html">home</a> <button>Join</button>
</body></html>
